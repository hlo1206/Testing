<!DOCTYPE html>
<html>
<head>
    <title>Student App Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="text-center p-8 bg-gray-800 rounded-lg">
        <h1 class="text-2xl font-bold mb-4">Student App Test</h1>
        <button onclick="requestPermission()" class="bg-blue-600 px-6 py-3 rounded-lg font-bold">
            Enable Notifications
        </button>
    </div>

    <script>
        // Service Worker Register karna zaroori hai
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        async function requestPermission() {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                const registration = await navigator.serviceWorker.ready;
                registration.showNotification('Student App Pro', {
                    body: 'Welcome bro! Ye wala working hai ✅',
                    icon: 'https://cdn-icons-png.flaticon.com/512/148/148767.png'
                });
            } else {
                alert("Permission denied! Setting mein jaakar allow karo.");
            }
        }
    </script>
</body>
</html>
