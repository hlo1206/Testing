<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student App Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 text-white flex flex-col items-center justify-center h-screen">

    <div class="text-center p-6 bg-blue-800 rounded-2xl shadow-2xl border border-blue-400 w-80">
        <h1 class="text-2xl font-bold mb-2">Student App Pro</h1>
        <p class="text-blue-200 mb-6">Mobile Test Version</p>
        
        <div id="status" class="text-sm bg-blue-900 p-3 rounded-lg mb-4 text-blue-300">
            Checking Permissions...
        </div>

        <button onclick="requestAndShow()" class="bg-yellow-400 hover:bg-yellow-500 text-blue-900 px-6 py-3 rounded-xl font-bold w-full transition active:scale-95">
            Test Notification
        </button>
    </div>

    <script>
        // Notification Function
        function showNotification() {
            const options = {
                body: "Welcome bro working ok?? ✅",
                icon: "https://cdn-icons-png.flaticon.com/512/148/148767.png" // Ek dummy icon
            };
            new Notification("Student App Pro", options);
            document.getElementById('status').innerText = "Notification Sent!";
        }

        function requestAndShow() {
            if (!("Notification" in window)) {
                alert("This browser does not support notifications.");
            } else if (Notification.permission === "granted") {
                showNotification();
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        showNotification();
                    }
                });
            }
        }

        // Auto-check on load
        window.onload = () => {
            if (Notification.permission === "granted") {
                document.getElementById('status').innerText = "Ready to send notifications!";
            } else {
                document.getElementById('status').innerText = "Click the button to allow notifications.";
            }
        };
    </script>
</body>
</html>
